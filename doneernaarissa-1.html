<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doneer naar Issa</title>
  <meta name="description" content="Doneer naar Issa">
  <style>
    :root { color-scheme: dark; --blue: #1680ff; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      font-family: Arial, Helvetica, sans-serif; color: #f7f8fb;
      background: radial-gradient(ellipse at center, #101827 0%, #080d16 72%);
    }
    header {
      min-height: 84px; padding: 22px 4%; display: flex; align-items: center;
      justify-content: space-between; gap: 20px; border-bottom: 1px solid #202938;
    }
    .brand { font-size: clamp(20px, 2.3vw, 30px); font-weight: 750; letter-spacing: -.7px; }
    .brand span, h1 span { color: var(--blue); }
    nav { display: flex; gap: clamp(14px, 3vw, 38px); color: #c4ccda; }
    nav a { color: inherit; text-decoration: none; }
    nav a:first-child { color: var(--blue); }
    main {
      flex: 1; width: 100%; max-width: 1000px; margin: auto; padding: 100px 20px 90px;
      text-align: center;
    }
    h1 { font-size: clamp(42px, 7vw, 88px); line-height: 1.08; letter-spacing: -2.5px; margin: 10px 0 26px; }
    .intro { color: #aeb9ca; font-size: clamp(18px, 2.1vw, 25px); line-height: 1.55; margin: 0 auto 42px; }
    .buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; max-width: 780px; margin: 0 auto; }
    button {
      width: min(240px, 100%); min-height: 74px; border: 0; border-radius: 12px;
      background: var(--blue); color: white; font-size: 23px; font-weight: 700;
      cursor: default;
    }
    footer { text-align: center; color: #9da9bb; padding: 28px 16px; border-top: 1px solid #202938; font-size: 14px; }
    @media (max-width: 560px) {
      header { align-items: flex-start; flex-direction: column; }
      nav { flex-wrap: wrap; }
      main { padding-top: 70px; }
      h1 { letter-spacing: -1.5px; }
      button { width: 100%; max-width: 320px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">Doneer naar <span>Issa</span></div>
    <nav aria-label="Hoofdnavigatie">
      <a href="#">Home</a>
      <a href="#">Over Ons</a>
      <a href="#">Contact</a>
    </nav>
  </header>
  <main>
    <h1>Doneer naar <span>Issa</span></h1>
    <p class="intro">Elke donatie helpt! Jouw steun maakt een verschil.<br>Dankjewel voor je support!</p>
    <div class="buttons" aria-label="Donatiebedragen">
      <button type="button">€ 5</button>
      <button type="button">€ 10</button>
      <button type="button">€ 20</button>
      <button type="button">€ 50</button>
      <button type="button">€ 100</button>
    </div>
  </main>
  <footer>Doneer naar Issa &nbsp; © 2026 &nbsp; | &nbsp; Alle rechten voorbehouden.</footer>
</body>
</html>
